#show_version=6
# ROM lamp effect (leff) 118, function 0x01016f94, decoded from its code (rom/tools/leff_lift.py; ticks in rom/rom_data/io/leff_ops/leff_118.json). runs until stopped; sets this state and holds it.
# Colors: ffffff = on (both planes), aaaaaa = plane 1 only (2/3), 555555 = plane 0 only (1/3), 000000 = off.
- duration: 16ms
  lights:
    l_allspark_orange: "000000"
    l_center_lane_orange: "000000"
    l_left_orbit_orange: "000000"
    l_left_ramp_orange: "000000"
    l_right_orbit_orange: "000000"
    l_right_ramp_orange: "000000"
