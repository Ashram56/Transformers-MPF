#show_version=6
# ROM lamp effect (leff) 151, function 0x0100252c, decoded from its code (rom/tools/leff_lift.py; ticks in rom/rom_data/io/leff_ops/leff_151.json). runs until stopped: a cycle of 60 ticks (960 ms); lead-in of 9 ticks left out.
# Colors: ffffff = on, 7f7f7f = one plane only (dim / blink phase), 000000 = off.
- duration: 160ms
  lights:
    l_bumblebee_captive_ball: "000000"
- duration: 320ms
  lights:
    l_bumblebee_captive_ball: "7f7f7f"
- duration: 160ms
  lights:
    l_bumblebee_captive_ball: "ffffff"
- duration: 320ms
  lights:
    l_bumblebee_captive_ball: "7f7f7f"
