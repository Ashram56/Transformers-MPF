#show_version=6
# ROM lamp effect (leff) 155, function 0x01032b7c, decoded from its code (rom/tools/leff_lift.py; ticks in rom/rom_data/io/leff_ops/leff_155.json). ends by itself after 8 ticks (130 ms).
# Colors: ffffff = on, 7f7f7f = one plane only (dim / blink phase), 000000 = off.
- duration: 130ms
  coils:
    c_flash_right_ramp:
      action: pulse
      pulse_ms: 32
    c_flash_right_side:
      action: pulse
      pulse_ms: 32
