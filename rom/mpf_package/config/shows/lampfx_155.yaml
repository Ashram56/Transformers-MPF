#show_version=6
# ROM lamp effect (leff) 155, captured in the emulator (tools/emu/lfx.cpp). ends by itself after 140 ms.
# Colors: ffffff = on, 7f7f7f = second plane only (dim / blink phase), 000000 = off.
- duration: 140ms
  coils:
    c_flash_right_ramp:
      action: pulse
      pulse_ms: 32
    c_flash_right_side:
      action: pulse
      pulse_ms: 32
