# ROM lamp effect (leff) 26, captured in the emulator (tools/emu/lfx.cpp). ends by itself after 254 ms.
# Colors: ffffff = on, 7f7f7f = second plane only (dim / blink phase), 000000 = off.
- duration: 81ms
  coils:
    c_flash_pop_bumper:
      action: pulse
      pulse_ms: 32
- duration: 82ms
  coils:
    c_flash_pop_bumper:
      action: pulse
      pulse_ms: 32
- duration: 91ms
  coils:
    c_flash_pop_bumper:
      action: pulse
      pulse_ms: 32
