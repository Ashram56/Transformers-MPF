#show_version=6
# ROM lamp effect (leff) 128, function 0x0101c12c, decoded from its code (rom/tools/leff_lift.py; ticks in rom/rom_data/io/leff_ops/leff_128.json). runs until stopped; sets this state and holds it.
# Colors: ffffff = on, 7f7f7f = one plane only (dim / blink phase), 000000 = off.
- duration: 16ms
  lights:
    l_allspark_orange: "000000"
    l_center_lane_orange: "000000"
    l_left_orbit_orange: "000000"
    l_left_ramp_orange: "000000"
    l_right_orbit_orange: "000000"
    l_right_ramp_orange: "000000"
