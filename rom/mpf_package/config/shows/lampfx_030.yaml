#show_version=6
# ROM lamp effect (leff) 30, function 0x0102c79c, decoded from its code (rom/tools/leff_lift.py; ticks in rom/rom_data/io/leff_ops/leff_030.json). ends by itself after 21 ticks (341 ms).
# Colors: ffffff = on, 7f7f7f = one plane only (dim / blink phase), 000000 = off.
- duration: 114ms
  coils:
    c_flash_pop_bumper:
      action: pulse
      pulse_ms: 64
- duration: 114ms
  coils:
    c_flash_left_ramp:
      action: pulse
      pulse_ms: 64
- duration: 114ms
  coils:
    c_flash_right_ramp:
      action: pulse
      pulse_ms: 64
