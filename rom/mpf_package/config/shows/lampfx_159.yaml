#show_version=6
# ROM lamp effect (leff) 159, function 0x01004a44, decoded from its code (rom/tools/leff_lift.py; ticks in rom/rom_data/io/leff_ops/leff_159.json). runs until stopped: a cycle of 10 ticks (160 ms).
# Colors: ffffff = on (both planes), aaaaaa = plane 1 only (2/3), 555555 = plane 0 only (1/3), 000000 = off.
- duration: 80ms
  lights:
    l_right_2_bank_target_bot: "ffffff"
    l_right_2_bank_target_top: "ffffff"
- duration: 80ms
  lights:
    l_right_2_bank_target_bot: "000000"
    l_right_2_bank_target_top: "000000"
