#show_version=6
# ROM lamp effect (leff) 161, function 0x010048c8, decoded from its code (rom/tools/leff_lift.py; ticks in rom/rom_data/io/leff_ops/leff_161.json). ends by itself after 20 ticks (320 ms).
# Colors: ffffff = on, 7f7f7f = one plane only (dim / blink phase), 000000 = off.
- duration: 320ms
  coils:
    c_flash_right_side:
      action: pulse
      pulse_ms: 32
