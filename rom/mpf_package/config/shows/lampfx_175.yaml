#show_version=6
# ROM lamp effect (leff) 175, function 0x01026f44, decoded from its code (rom/tools/leff_lift.py; ticks in rom/rom_data/io/leff_ops/leff_175.json). runs until stopped: a cycle of 8 ticks (128 ms).
# Colors: ffffff = on (both planes), aaaaaa = plane 1 only (2/3), 555555 = plane 0 only (1/3), 000000 = off.
- duration: 64ms
  lights:
    l_optimus_prime_challenge: "ffffff"
- duration: 64ms
  lights:
    l_optimus_prime_challenge: "000000"
