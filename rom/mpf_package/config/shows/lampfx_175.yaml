#show_version=6
# ROM lamp effect (leff) 175, function 0x01026f44, decoded from its code (rom/tools/leff_lift.py; ticks in rom/rom_data/io/leff_ops/leff_175.json). runs until stopped: a cycle of 8 ticks (130 ms); lead-in of 3 ticks left out.
# Colors: ffffff = on, 7f7f7f = one plane only (dim / blink phase), 000000 = off.
- duration: 65ms
  lights:
    l_optimus_prime_challenge: "ffffff"
- duration: 65ms
  lights:
    l_optimus_prime_challenge: "000000"
