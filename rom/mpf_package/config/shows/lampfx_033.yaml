#show_version=6
# ROM lamp effect (leff) 33, captured in the emulator (tools/emu/lfx.cpp). ends by itself after 146 ms.
# Colors: ffffff = on, 7f7f7f = second plane only (dim / blink phase), 000000 = off.
- duration: 146ms
  coils:
    c_flash_left_ramp:
      action: pulse
      pulse_ms: 32
    c_flash_pop_bumper:
      action: pulse
      pulse_ms: 32
