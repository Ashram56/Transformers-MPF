#show_version=6
# ROM lamp effect (leff) 104, function 0x01023150, decoded from its code (rom/tools/leff_lift.py; ticks in rom/rom_data/io/leff_ops/leff_104.json). runs until stopped: a cycle of 8 ticks (128 ms).
# Colors: ffffff = on, 7f7f7f = one plane only (dim / blink phase), 000000 = off.
- duration: 64ms
  lights:
    l_starscream: "000000"
- duration: 64ms
  lights:
    l_starscream: "ffffff"
