# ROM lamp effect (leff) 167, function 0x0100b540, decoded from its code (rom/tools/leff_lift.py; ticks in rom/rom_data/io/leff_ops/leff_167.json). ends by itself after 32 ticks (512 ms).
# Colors: ffffff = on (both planes), aaaaaa = plane 1 only (2/3), 555555 = plane 0 only (1/3), 000000 = off.
- duration: 256ms
  coils:
    c_flash_megatron:
      action: pulse
      pulse_ms: 48
- duration: 128ms
  coils:
    c_flash_megatron:
      action: pulse
      pulse_ms: 48
