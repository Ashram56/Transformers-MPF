#show_version=6
# ROM lamp effect (leff) 152, function 0x01032460, decoded from its code (rom/tools/leff_lift.py; ticks in rom/rom_data/io/leff_ops/leff_152.json). ends by itself after 8 ticks (128 ms).
# Colors: ffffff = on (both planes), aaaaaa = plane 1 only (2/3), 555555 = plane 0 only (1/3), 000000 = off.
- duration: 128ms
  coils:
    c_flash_right_side:
      action: pulse
      pulse_ms: 32
