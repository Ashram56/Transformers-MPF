#show_version=6
# ROM lamp effect (leff) 13, function 0x00028168, decoded from its code (rom/tools/leff_lift.py; ticks in rom/rom_data/io/leff_ops/leff_013.json). runs until stopped: a cycle of 20 ticks (320 ms).
# Colors: ffffff = on, 7f7f7f = one plane only (dim / blink phase), 000000 = off.
- duration: 160ms
  lights:
    l_roll_out: "ffffff"
- duration: 160ms
  lights:
    l_roll_out: "000000"
