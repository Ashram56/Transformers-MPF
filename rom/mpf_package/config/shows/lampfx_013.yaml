#show_version=6
# ROM lamp effect (leff) 13, captured in the emulator (tools/emu/lfx.cpp). loops in the ROM (period 325 ms).
# Colors: ffffff = on, 7f7f7f = second plane only (dim / blink phase), 000000 = off.
- duration: 162ms
  lights:
    l_roll_out: "ffffff"
- duration: 163ms
  lights:
    l_roll_out: "000000"
