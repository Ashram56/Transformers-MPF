#show_version=6
# ROM lamp effect (leff) 87, function 0x01037060, decoded from its code (rom/tools/leff_lift.py; ticks in rom/rom_data/io/leff_ops/leff_087.json). runs until stopped: a cycle of 6 ticks (96 ms); lead-in of 5 ticks left out.
# Colors: ffffff = on, 7f7f7f = one plane only (dim / blink phase), 000000 = off.
- duration: 48ms
  lights:
    l_allspark_orange: "000000"
    l_allspark_purple: "000000"
    l_allspark_red: "000000"
    l_allspark_x: "000000"
    l_center_lane_orange: "000000"
    l_center_lane_purple: "000000"
    l_center_lane_red: "000000"
    l_left_orbit_orange: "000000"
