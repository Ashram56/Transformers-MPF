#show_version=6
# ROM lamp effect (leff) 149, captured in the emulator (tools/emu/lfx.cpp). ends by itself after 238 ms.
# Colors: ffffff = on, 7f7f7f = second plane only (dim / blink phase), 000000 = off.
- duration: 114ms
  coils:
    c_flash_left_ramp:
      action: pulse
      pulse_ms: 64
- duration: 124ms
  coils:
    c_flash_right_ramp:
      action: pulse
      pulse_ms: 64
