#show_version=6
# ROM lamp effect (leff) 140, captured in the emulator (tools/emu/lfx.cpp). ends by itself after 340 ms.
# Colors: ffffff = on, 7f7f7f = second plane only (dim / blink phase), 000000 = off.
- duration: 82ms
  coils:
    c_flash_left_ramp:
      action: pulse
      pulse_ms: 32
    c_flash_right_ramp:
      action: pulse
      pulse_ms: 32
- duration: 83ms
  coils:
    c_flash_left_ramp:
      action: pulse
      pulse_ms: 32
    c_flash_right_ramp:
      action: pulse
      pulse_ms: 32
- duration: 175ms
  coils:
    c_flash_left_ramp:
      action: pulse
      pulse_ms: 32
    c_flash_right_ramp:
      action: pulse
      pulse_ms: 32
