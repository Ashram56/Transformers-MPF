#show_version=6
# ROM lamp effect (leff) 140, function 0x01030ef4, decoded from its code (rom/tools/leff_lift.py; ticks in rom/rom_data/io/leff_ops/leff_140.json). ends by itself after 20 ticks (320 ms).
# Colors: ffffff = on (both planes), aaaaaa = plane 1 only (2/3), 555555 = plane 0 only (1/3), 000000 = off.
- duration: 80ms
  coils:
    c_flash_left_ramp:
      action: pulse
      pulse_ms: 32
    c_flash_right_ramp:
      action: pulse
      pulse_ms: 32
