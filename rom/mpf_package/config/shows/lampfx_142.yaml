#show_version=6
# ROM lamp effect (leff) 142, function 0x01009ab0, decoded from its code (rom/tools/leff_lift.py; ticks in rom/rom_data/io/leff_ops/leff_142.json). ends by itself after 48 ticks (780 ms).
# Colors: ffffff = on, 7f7f7f = one plane only (dim / blink phase), 000000 = off.
- duration: 764ms
  lights:
    l_energon_center: "000000"
    l_energon_left: "000000"
    l_energon_right: "000000"
