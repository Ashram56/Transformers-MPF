# ROM lamp effect (leff) 142, function 0x01009ab0, decoded from its code (rom/tools/leff_lift.py; ticks in rom/rom_data/io/leff_ops/leff_142.json). ends by itself after 48 ticks (768 ms).
# Colors: ffffff = on (both planes), aaaaaa = plane 1 only (2/3), 555555 = plane 0 only (1/3), 000000 = off.
- duration: 752ms
  lights:
    l_energon_center: "000000"
    l_energon_left: "000000"
    l_energon_right: "000000"
