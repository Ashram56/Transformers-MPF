#show_version=6
# ROM lamp effect (leff) 92, function 0x01031a04, decoded from its code (rom/tools/leff_lift.py; ticks in rom/rom_data/io/leff_ops/leff_092.json). runs until stopped; sets this state and holds it.
# Colors: ffffff = on (both planes), aaaaaa = plane 1 only (2/3), 555555 = plane 0 only (1/3), 000000 = off.
- duration: 16ms
  lights:
    l_top_lane_purple_bot: "000000"
    l_top_lane_purple_top: "000000"
    l_top_lane_red_bot: "000000"
    l_top_lane_red_top: "000000"
