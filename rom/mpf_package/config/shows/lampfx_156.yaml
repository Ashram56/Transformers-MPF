#show_version=6
# ROM lamp effect (leff) 156, function 0x01003dac, decoded from its code (rom/tools/leff_lift.py; ticks in rom/rom_data/io/leff_ops/leff_156.json). ends by itself after 20 ticks (320 ms).
# Colors: ffffff = on (both planes), aaaaaa = plane 1 only (2/3), 555555 = plane 0 only (1/3), 000000 = off.
- duration: 16ms
  coils:
    c_flash_left_ramp:
      action: pulse
      pulse_ms: 32
    c_flash_right_ramp:
      action: pulse
      pulse_ms: 32
- duration: 32ms
  lights:
