# ROM lamp effect (leff) 156, function 0x01003dac, decoded from its code (rom/tools/leff_lift.py; ticks in rom/rom_data/io/leff_ops/leff_156.json). ends by itself after 20 ticks (325 ms).
# Colors: ffffff = on, 7f7f7f = one plane only (dim / blink phase), 000000 = off.
- duration: 16ms
  coils:
    c_flash_left_ramp:
      action: pulse
      pulse_ms: 32
    c_flash_right_ramp:
      action: pulse
      pulse_ms: 32
- duration: 33ms
