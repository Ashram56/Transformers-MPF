#config_version=6
# Generated from the Stern Transformers Pro v1.80 ROM (PinMAME set tf_180). See ../README.md.
# number: the SAM driver number (1-32 on the IO board, 33-35 aux bus ticket outputs). FLASH: entries are
# flashers. Motors and the orbit gate (5, 8, 30) are held outputs. Pulse and hold times were measured from the
# solenoid register writes in the emulator (rom_data/io/coil_timing.csv, mpf_source column of coils.csv).
coils:
  c_trough_up_kicker:
    number: 1   # TROUGH UP-KICKER
    default_pulse_ms: 64   # observed in play
  c_auto_launch:
    number: 2   # AUTO LAUNCH
    default_pulse_ms: 64   # observed in play
  c_megatron_lockup:
    number: 3   # MEGATRON LOCKUP
    default_pulse_ms: 64   # observed in ball search only
  c_orbit_control_gate:
    number: 5   # ORBIT CONTROL GATE
    default_hold_power: 1.0   # held on, not pulsed
  c_shaker_motor_optional:
    number: 8   # SHAKER MOTOR (OPTIONAL)
    default_hold_power: 1.0   # held on, not pulsed
    # the game ran it 202 ms at a time
  c_top_pop_bumper:
    number: 9   # TOP POP BUMPER
    default_pulse_ms: 34   # observed in play
  c_right_pop_bumper:
    number: 10   # RIGHT POP BUMPER
    default_pulse_ms: 34   # observed in play
  c_bottom_pop_bumper:
    number: 11   # BOTTOM POP BUMPER
    default_pulse_ms: 34   # observed in play
  c_optimus_prime:
    number: 12   # OPTIMUS PRIME
    default_pulse_ms: 65   # observed in play
  c_left_slingshot:
    number: 13   # LEFT SLINGSHOT
    default_pulse_ms: 67   # observed in play
  c_right_slingshot:
    number: 14   # RIGHT SLINGSHOT
    default_pulse_ms: 68   # observed in play
  c_left_flipper:
    number: 15   # LEFT FLIPPER
    default_pulse_ms: 40   # flipper: pulse then hold PWM 1 ms on / 12 ms (observed)
    default_hold_power: 0.083
  c_right_flipper:
    number: 16   # RIGHT FLIPPER
    default_pulse_ms: 41   # flipper: pulse then hold PWM 1 ms on / 12 ms (observed)
    default_hold_power: 0.084
  c_flash_decepticon:
    number: 17   # FLASH: DECEPTICON
    default_pulse_ms: 32   # not fired in traces; ROM coil test time
  c_flash_left_ramp:
    number: 18   # FLASH: LEFT RAMP
    default_pulse_ms: 65   # observed in play
  c_flash_right_side:
    number: 19   # FLASH: RIGHT SIDE
    default_pulse_ms: 32   # not fired in traces; ROM coil test time
  c_flash_bumblebee:
    number: 20   # FLASH: BUMBLEBEE
    default_pulse_ms: 64   # not fired in traces; ROM coil test time
  c_flash_pop_bumper:
    number: 21   # FLASH: POP BUMPER
    default_pulse_ms: 32   # observed in play
  c_left_eject:
    number: 22   # LEFT EJECT
    default_pulse_ms: 65   # observed in play
  c_flash_right_ramp:
    number: 23   # FLASH: RIGHT RAMP
    default_pulse_ms: 65   # observed in play
  c_optional_coil:
    number: 24   # OPTIONAL COIL
    default_pulse_ms: 81   # observed in play
  c_flash_center_lane_arrow:
    number: 25   # FLASH: CENTER LANE ARROW
    default_pulse_ms: 32   # not fired in traces; ROM coil test time
  c_flash_slingshot_left:
    number: 26   # FLASH: SLINGSHOT (LEFT)
    default_pulse_ms: 32   # not fired in traces; ROM coil test time
  c_flash_slingshot_right:
    number: 27   # FLASH: SLINGSHOT (RIGHT)
    default_pulse_ms: 32   # not fired in traces; ROM coil test time
  c_flash_megatron:
    number: 28   # FLASH: MEGATRON
    default_pulse_ms: 66   # observed in play
  c_optimus_prime_motor:
    number: 30   # OPTIMUS PRIME MOTOR
    default_hold_power: 1.0   # held on, not pulsed
  c_flash_optimus_prime:
    number: 31   # FLASH: OPTIMUS PRIME
    default_pulse_ms: 66   # observed in play
  c_flash_allspark:
    number: 32   # FLASH: ALLSPARK
    default_pulse_ms: 49   # observed in play
  c_aux_1_ticket_advance:
    number: 33   # AUX 1: TICKET ADVANCE
    default_pulse_ms: 64   # not fired in traces; ROM coil test time
  c_aux_2_ticket_meter:
    number: 34   # AUX 2: TICKET METER
    default_pulse_ms: 64   # not fired in traces; ROM coil test time
  c_aux_3_ticket_enable:
    number: 35   # AUX 3: TICKET ENABLE
    default_pulse_ms: 64   # not fired in traces; ROM coil test time
