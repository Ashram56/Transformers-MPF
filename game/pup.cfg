; PuP Pack: TerryRed's Transformers (Stern) PuP-Pack v1.0 (tf_180), on three screens (docs/pup.md).
; Read by Godot (game/pup/pup_player.gd) and by MPF (game/pup_runtime/), both vendored from
; Ashram56/Stern-SAM-Decryption tools/pup/runtime.
;
; Do not edit this file for your cabinet: put the keys you change in game/pup.local.cfg (git-ignored,
; same sections), it is read after this one. TF_PUP=0 in the environment turns the whole PuP off.
; Values are JSON: true/false, numbers, "strings", [lists].

[pup]

; false: no PuP windows, no PuP videos, the ROM music plays as before (the strict game)
enabled=true
; environment prefix: TF_PUP=0 (off), TF_PUP_ZIP=<the author's zip> (scripts/pup_setup.py)
env="TF"
title="Transformers"
; the windows, in stack order; optional ones follow third_screen
windows=["backglass", "dmd", "topper"]
optional=["topper"]
; the third screen (topper videos, PuP screen 0); false = no window, no topper videos
third_screen=true
; the pack's music (PuP screen 4) instead of the ROM music; false keeps the ROM music, still plays the videos
ost_music=true
music_screen=4
; the pack (pup_pack submodule: the private Ashram56/Transformers-PuP), its converted media, the trigger map
pack_dir="pup_pack/tf_180"
media_dir="pup_media/tf_180"
submodule="pup_pack"
pack_repo="Ashram56/Transformers-PuP"
trigger_map="tf_pup/trigger_map.yaml"
; MPF side: the media bridge (machine.tf.media) whose music calls are dropped while the pack's music plays
bridge="tf.media"
; the current player's rule state (machine.tf.pd), given to every event as `state`: {state.side==1} Autobot, 2 Decepticon
state="tf.pd"
attract_mode="attract"
; seconds between two pup_attract_cycle events while attract runs (the pack's attract trailers rest 120 s)
attract_cycle_seconds=60.0
; volumes in percent, applied on top of the pack's own playlist/trigger volumes
video_volume=100
music_volume=100
; "stack": the windows one under the other at the left of the backglass's monitor, as large as its height
; allows (each keeps the shape of its size below). "manual": every window at its own screen/position/size
; below (a cabinet: set this in pup.local.cfg)
layout="stack"

; Every window: screen = monitor index (0 = primary), position/size in pixels on that monitor,
; fullscreen = cover the whole monitor (position/size ignored), borderless = no title bar.

; Screen 1: the backglass (16:9, the pack's "Option 1 - Backglass, Topper"). PuP screen 2 is the backglass
; video; 11 (the text panel), 12 and 13 (the crests) and 14 and 15 (the Decepticon and Autobot faces) sit over
; it where the pack's screens.pup (CustomPos) puts them.
[backglass]

enabled=true
layers=[2, 11, 12, 13, 14, 15]
screen=0
position=[0, 0]
size=[1280, 720]
fullscreen=false
borderless=false
fit="fit"
align=0.5

; Screen 2: the large DMD, the game's own 128x32 DMD in the pack's DMD panel art (the bottom of its 4:3
; backbox art, PuPAlphas). frame_crop = [x, y, w, h] in pixels of frame_image; dmd_rect = the DMD's hole.
[dmd]

dmd=true
screen=0
position=[0, 740]
size=[1280, 304]
fullscreen=false
borderless=false
background="frame"
frame_image="PuPAlphas/TF Backbox 4x3 or 5x4.png"
frame_crop=[0, 1080, 1920, 456]
dmd_rect=[294, 1191, 1330, 277]
; round dots like a real DMD (false: square pixels)
dots=true
; minimise the game's own 128x32 window (it stays the source of the DMD picture)
hide_main_window=true

; Screen 3 (optional, [pup] third_screen): the topper, PuP screen 0 (off in the pack's shipped option: its
; ReadMe says to force it on when a topper display exists, which this does).
[topper]

layers=[0]
screen=0
position=[0, 0]
size=[1280, 360]
fullscreen=false
borderless=false
fit="fill"
align=0.5

; scripts/pup_captures.py: the frames the game can show, and the event a display effect posts
[captures]

frames=["rom/mpf_package/media/dmd/deffs/deff_*/frames/*.png", "rom/mpf_package/media/dmd/deffs/deff_*/reference_capture.gif", "rom/mpf_package/media/dmd_library/anim_*/animation_128x32.gif"]
event_map="rom/mpf_package/event_map.csv"
event="tf_deff_{id}"
