#config_version=6

# Hardware overlay for the desktop and MPF Monitor, on top of the platform-neutral config.yaml:
#   cd game && ../.venv/bin/mpf game . -c config,hw_virtual   (or: python scripts/run.py)
# smart_virtual moves balls between the ball devices when their eject coils pulse and sets their switches to
# match (MPF's smart_virtual platform); everything else is the game as is. MPF Monitor connects to MPF's own
# BCP server (127.0.0.1:5051) and uses game/monitor/monitor.yaml (docs/hardware.md).

hardware:
  platform: smart_virtual

# The trough starts full: 4 balls (machine: balls_installed)
virtual_platform_start_active_switches: s_trough_1_r, s_trough_2, s_trough_3, s_trough_4_l

# The trough's balls roll toward the eject end, as on the machine (tf/virtual_hardware.py).
custom_code: tf.os_layer.TfOS, tf.virtual_hardware.VirtualTrough
