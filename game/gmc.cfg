[gmc]

fullscreen=false
exit_on_esc=true
logging_global=20

[sound_system]

music={"type": "solo"}
sfx={"type": "simultaneous", "simultaneous_sounds": 8, "default": true}
voice={"type": "simultaneous", "simultaneous_sounds": 2, "duck_default": true}

; Keys in the DMD window that close switches over BCP (desktop testing; MPF Monitor clicks do the same).
; Keys are matched by their label, else by their position on a US keyboard (scripts/gmc_patch.py), so on
; AZERTY the unshifted number row works too.
; ["switch", name] follows the key (closed while held); ["switch", name, "toggle"] flips it per press.
[keyboard]

5=["switch", "s_right_coin_slot"]
1=["switch", "s_start_button"]
z=["switch", "s_l_flipper_button"]
slash=["switch", "s_r_flipper_button"]
left=["switch", "s_l_flipper_button"]
right=["switch", "s_r_flipper_button"]
space=["switch", "s_shooter_lane", "inactive"]
t=["switch", "s_tilt_pendulum"]
d=["switch", "s_coin_door_open", "toggle"]
7=["switch", "s_back"]
8=["switch", "s_minus"]
9=["switch", "s_plus"]
0=["switch", "s_select"]
