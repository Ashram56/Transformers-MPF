# What the PuP Pack's trigger codes mean in this MPF game (read by game/pup_runtime/engine.py; docs/pup.md).
#
# In Visual Pinball, PinUP Player watches PinMAME's DMD: D<n> fires when the pixels inside the purple
# rectangle of PupCapture/<n>.bmp (the whole frame when it has none) appear on the DMD. Here the rules say it
# instead: the game posts tf_deff_<id> when display effect <id> takes the DMD (game/tf/display.py), so each D<n>
# is mapped to the effect(s) whose frames contain that capture. scripts/pup_captures.py matches the captures
# against every recorded frame and library animation and writes docs/pup_captures.md; re-run it after a sync.
#
# Plain lines come from that match (score >= 90 %). Lines marked "hand" were set by hand: the ROM shows one
# animation per shot, side or lock, but the package recorded only one variant per effect, so the captures of
# the others match a library animation no effect is credited with; they are told apart by the event's arguments:
#   {left==n, completed==0/1}  battle hits: the shots left after the hit, which picks the ROM's animation
#                              (index BASE - left in the battle's table; tf/features/battles.py hit_media)
#   {values.0==n}              the effect's values (lock number)
#   {anim==n}                  which of the deff's animations the ROM picks: the jackpot shot or a random draw, the
#                              wizard shot (+ 6 on its completing hit): tf/features/optimus.py, megatron.py, wizard.py
#   {state.side==1 / 2}        the player's side (1 Autobot, 2 Decepticon: [pup] state="tf.pd")
#   {state.mtl_music_d==663}   the Decepticon lock music call (0x297-0x299, tf/features/megatron.py): the lock round
#   {count==n}                 the n-th time since the counter's reset (counters: below)
# "code" lines were checked against the ROM: the deff's animation table and what selects in it (address given),
# each entry's first image matched to the capture. "inferred" means the order is the pack's row order, unchecked.
# Two captures of one animation (Blackout D26 / D28, Starscream D112 / D113, Optimus D148-D150) both map to it:
# PinMAME fires the capture whose frame comes first; here both rows fire and their priorities decide.
# Synthetic events (pup_runtime/mode.py): pup_boot (PuP player ready), pup_power_up, pup_attract_cycle.

